<!-- SNIPPET 1: CREATIENDAS STORE BUILDER -->
<!-- Widget para Constructor de Tiendas WhatsApp -->

<script>
    (function () {
        const CREATIENDAS_URL = 'https://creatiendasgit1.vercel.app';

        // Crear botón flotante
        const btn = document.createElement('button');
        btn.innerHTML = '🏪 Crear Tienda';
        btn.style.cssText = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, #1877F2 0%, #0866FF 100%);
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    z-index: 9998;
    box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3);
    transition: all 0.3s ease;
  `;

        btn.onmouseover = () => {
            btn.style.transform = 'scale(1.05)';
            btn.style.boxShadow = '0 6px 20px rgba(24, 119, 242, 0.5)';
        };

        btn.onmouseout = () => {
            btn.style.transform = 'scale(1)';
            btn.style.boxShadow = '0 4px 15px rgba(24, 119, 242, 0.3)';
        };

        // Crear modal
        const modal = document.createElement('div');
        modal.style.cssText = `
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    backdrop-filter: blur(5px);
  `;

        const container = document.createElement('div');
        container.style.cssText = `
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.3);
    width: 95%;
    max-width: 1200px;
    height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  `;

        const header = document.createElement('div');
        header.style.cssText = `
    background: linear-gradient(135deg, #1877F2 0%, #0866FF 100%);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  `;
        header.innerHTML = `
    <h3 style="margin: 0; font-size: 20px;">🏪 Creatiendas - Constructor de Tiendas</h3>
    <button id="close-creatiendas" style="
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    ">×</button>
  `;

        const iframe = document.createElement('iframe');
        iframe.style.cssText = `
    width: 100%;
    height: 100%;
    border: none;
  `;
        iframe.src = `${CREATIENDAS_URL}/builder`;

        container.appendChild(header);
        container.appendChild(iframe);
        modal.appendChild(container);
        document.body.appendChild(btn);
        document.body.appendChild(modal);

        btn.onclick = () => {
            modal.style.display = 'flex';
        };

        document.getElementById('close-creatiendas').onclick = () => {
            modal.style.display = 'none';
        };

        modal.onclick = (e) => {
            if (e.target === modal) modal.style.display = 'none';
        };
    })();
</script>

4. Al hacer clic, abre el constructor de tiendas completo
