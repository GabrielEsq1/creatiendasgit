<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatiendas - Tutorial de Usuario</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slide.active {
            opacity: 1;
        }

        .overlay {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 80%;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .overlay h2 {
            margin: 0 0 10px 0;
            color: #22c55e;
            font-size: 2rem;
        }

        .overlay p {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.5;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 5px;
            background-color: #22c55e;
            width: 0%;
            transition: width 0.1s linear;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>

    <div id="container">
        <div class="slide" id="slide1" style="background-image: url('tutorial/1_home.png');"></div>
        <div class="slide" id="slide2" style="background-image: url('tutorial/2_register.png');"></div>
        <div class="slide" id="slide3" style="background-image: url('tutorial/3_login.png');"></div>

        <div class="overlay" id="overlay">
            <h2 id="title">Cargando...</h2>
            <p id="desc">Preparando presentación...</p>
        </div>

        <div class="progress-bar" id="progress"></div>

        <div class="controls">
            <button onclick="togglePlay()" id="playBtn">⏸ Pausar</button>
            <button onclick="reset()">↺ Reiniciar</button>
        </div>
    </div>

    <script>
        const slides = [
            {
                id: 'slide1',
                title: '1. Página de Inicio',
                desc: 'Bienvenido a Creatiendas. Aquí tus clientes conocen la propuesta de valor: Tiendas rápidas, sin comisiones y con prueba gratis.'
            },
            {
                id: 'slide2',
                title: '2. Registro Fácil',
                desc: 'El proceso de alta es inmediato. Solo necesitas un nombre, correo y contraseña para empezar tu prueba gratuita de 30 días.'
            },
            {
                id: 'slide3',
                title: '3. Acceso Seguro',
                desc: 'Inicia sesión en tu panel de control para gestionar productos, ver estadísticas y configurar tu tienda de WhatsApp.'
            }
        ];

        let currentStep = 0;
        let isPlaying = true;
        const duration = 5000; // 5 seconds per slide
        let startTime;
        let animationFrame;

        function showSlide(index) {
            // Hide all slides
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));

            // Show current
            const step = slides[index];
            document.getElementById(step.id).classList.add('active');

            // Update text
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = 0;
            overlay.style.transform = 'translateX(-50%) translateY(20px)';

            setTimeout(() => {
                document.getElementById('title').textContent = step.title;
                document.getElementById('desc').textContent = step.desc;
                overlay.style.opacity = 1;
                overlay.style.transform = 'translateX(-50%) translateY(0)';
            }, 500);
        }

        function nextSlide() {
            currentStep = (currentStep + 1) % slides.length;
            showSlide(currentStep);
        }

        function loop(timestamp) {
            if (!isPlaying) return;
            if (!startTime) startTime = timestamp;

            const elapsed = timestamp - startTime;
            const progress = Math.min((elapsed / duration) * 100, 100);

            document.getElementById('progress').style.width = progress + '%';

            if (elapsed >= duration) {
                nextSlide();
                startTime = timestamp;
            }

            animationFrame = requestAnimationFrame(loop);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸ Pausar' : '▶ Reproducir';
            if (isPlaying) {
                startTime = performance.now(); // Reset timing slightly to avoid jump
                animationFrame = requestAnimationFrame(loop);
            } else {
                cancelAnimationFrame(animationFrame);
            }
        }

        function reset() {
            currentStep = 0;
            startTime = performance.now();
            showSlide(0);
            if (!isPlaying) togglePlay();
        }

        // Start
        showSlide(0);
        animationFrame = requestAnimationFrame(loop);

    </script>

</body>

</html>
